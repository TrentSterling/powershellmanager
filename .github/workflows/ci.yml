name: Windows checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      native_coverage:
        description: Run the full 100% coverage gate on an interactive Windows runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: powershellmanager-windows-x64
          path: |
            target/release/powershellmanager.exe
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.txt
            README.md
  native-coverage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_coverage }}
    runs-on: [self-hosted, Windows, X64, psm-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: rustup toolchain install nightly-2026-09-29 --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-coverage-2026-09-29
      - run: cargo +1.93.0 install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo +nightly-2026-09-29 fetch --locked
      - name: Native audits, GPU review, CLI smoke and full coverage gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target -Force | Out-Null
          ./scripts/coverage.ps1 -EnforceFullCoverage -CoverageToolchain nightly-2026-09-29 *> target/coverage-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powershellmanager-native-quality
          path: |
            target/coverage.json
            target/coverage-run.log
            target/ui-review/*.png
